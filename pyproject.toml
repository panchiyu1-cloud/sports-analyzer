[project]
name = "sports-analyzer"
version = "0.1.0"
description = "Daily baseball (MLB) and football (top-5 leagues + UCL) match analyzer: model vs market, rendered as static cards."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sports_analyzer.render" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
