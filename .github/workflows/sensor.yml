name: 盯盤 (sensor)

# Every few minutes the owner's free odds-api.io key (two bookmakers; 100 requests an
# hour, 500 a day) reads the match-winner prices of the matches with a 運彩 price that
# start within 48 hours: every ten minutes within 24 hours, every 30 beyond, and more
# often whenever a request has free places or the day has requests to spare
# (src/sports_analyzer/sensor.py; it goes by the time since each reading, so runs that
# come early or late change nothing). The act job then
# - buys the consensus of a competition where a side has moved 3 percentage points or
#   more since it was last bought (h2h; MLB also the run line: 1-2 credits, within the
#   budget plus the pre-game extra) and judges the last 運彩 upload against it (延遲雷達);
# - reviews the matches that have just finished (review --new-only: football 2 h, MLB
#   2.5 h after kickoff, asked again each round until the result is in);
# then renders and commits. GitHub starts scheduled runs late and skips some: here they
# came 25-47 minutes apart whether asked for every ten or every five minutes. So a run
# keeps going: after each round it waits for the next reading or review to fall due
# (`next`, usually ten minutes) and goes again, for up to about 40 minutes, and stops at
# once when a round has something to buy or review (the act job runs after it).
#
# odds-api.io's data never reaches the repo or the page (its terms): the sensor's state
# stays in the Actions cache, and only a counts-only status goes to the side branch
# sensor-status. Nothing is pushed to the phone (owner's choice).

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sensor
  cancel-in-progress: false

permissions:
  contents: write
  actions: read  # to see whether a daily-group task is running or waiting

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      buy: ${{ steps.sensor.outputs.buy }}
      review: ${{ steps.sensor.outputs.review }}
    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the sensor's state
        uses: actions/cache/restore@v4
        with:
          path: .sensor
          key: sensor-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sensor-
      # Rounds until something is to be done or the run has gone on long enough. Before
      # each: is a daily-group task running or waiting? The act job waits for that
      # group, and a job queued then could cancel a waiting upload's run (a group keeps
      # one waiting run), so such a round reads but asks for nothing (--hold). Each
      # round reads the newest snapshots, reviews and budget from main first.
      - name: Read the two bookmakers, round after round
        id: sensor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(date +%s)
          buy=""; review=""
          for round in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- data/snapshots data/reviews data/odds_budget.json || true
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=60" --jq '
              [.workflow_runs[] | select(.status != "completed")
               | select(.path | test("/(daily|evening|tw|radar|review|backtest)\\.yml$"))]
              | length') || busy=1
            hold=""; [ "$busy" = "0" ] || hold="--hold"
            : > "$RUNNER_TEMP/round"
            GITHUB_OUTPUT="$RUNNER_TEMP/round" python -m sports_analyzer.pipeline sensor $hold
            buy=$(sed -n 's/^buy=//p' "$RUNNER_TEMP/round" | tail -1)
            review=$(sed -n 's/^review=//p' "$RUNNER_TEMP/round" | tail -1)
            next=$(sed -n 's/^next=//p' "$RUNNER_TEMP/round" | tail -1)
            elapsed=$(( ($(date +%s) - started) / 60 ))
            echo "round $round: busy=$busy buy=${buy:-none} review=${review:-none} next=${next:-none} min, ${elapsed} min in"
            if [ -n "$buy" ] || [ -n "$review" ]; then break; fi
            if [ -z "$next" ] || [ "$next" -gt 15 ] || [ $((elapsed + next)) -gt 40 ]; then break; fi
            sleep $((next * 60))
          done
          echo "buy=$buy" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
      - name: Keep the sensor's state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sensor
          key: sensor-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Status (counts only) to the side branch sensor-status
        if: always()
        run: |
          [ -f .sensor/status.json ] || exit 0
          cp .sensor/status.json "$RUNNER_TEMP/status.json"
          git config user.name "sports-analyzer bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan sensor-status
          git rm -rq --cached .
          mkdir -p sensor && cp "$RUNNER_TEMP/status.json" sensor/status.json
          git add -f sensor/status.json
          git commit -qm "chore(sensor): status"
          git push -qf origin sensor-status

  act:
    needs: watch
    if: needs.watch.outputs.buy != '' || needs.watch.outputs.review != ''
    runs-on: ubuntu-latest
    # The same group as every task that writes the snapshots, so none of them race.
    concurrency:
      group: daily
      cancel-in-progress: false
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}  # results for the review
      BUY: ${{ needs.watch.outputs.buy }}
      REVIEW: ${{ needs.watch.outputs.review }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run starts from the newest commit, not the one that triggered it
          fetch-depth: 60  # enough history to date the 運彩 uploads (fetch/taiwan.normalize_uploads)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buy the consensus for the competitions that moved, against the last 運彩 upload
        if: env.BUY != ''
        run: python -m sports_analyzer.pipeline radar --only "$BUY"
      - name: Review the matches that have just finished
        if: env.REVIEW != ''
        continue-on-error: true
        run: python -m sports_analyzer.pipeline review --new-only
      - name: Commit
        run: |
          what="${BUY:+consensus for $BUY moved}${BUY:+${REVIEW:+, }}${REVIEW:+post-match reviews}"
          bash scripts/commit_generated.sh "chore(sensor): $(date -u +%Y-%m-%dT%H:%M) $what" data/snapshots data/ledger.csv data/tw_ledger.csv data/reviews data/moves data/odds_budget.json data/tw docs
