name: 臺股強勢掃描 (stock)

# The owner's Taiwan stock scanner (stock/, a separate project from the sports pipeline,
# see CLAUDE.md "臺股強勢掃描") runs here so that its page, docs/stock/, works without his
# computer. A weekday run covers the trading session: it starts before the 09:00 open,
# reads the exchange's real-time quotes every few seconds, re-ranks every minute and pushes
# the page's JSON files to the orphan branch stock-data (one commit, replaced every time)
# until 14:10, after the official closing prices (~13:50). The evening runs pick up the
# institutional buy/sell data (published ~15:00-16:30) and recompute the closing list and
# the review.
#
# GitHub starts scheduled runs late (on 2026-11-13 none of 08:05-09:10 had started by 09:13,
# and the sensor's every-five-minutes runs had a 95-minute gap), so the session has many start
# times from 05:00: the first one that starts runs the session; later ones wait in the
# concurrency queue. A run lasts at most ~5h40m (the job limit is 6 h): when it stops before
# 14:10 it starts its successor itself (workflow_dispatch, step "Hand over"), which restores
# its cache and carries on. A run that starts after 14:10 scans once, publishes, ends.
# State (price history of ~1,400 stocks, lists, the review) lives in the Actions cache; the
# small files that cannot be rebuilt are also copied to stock-data/state/.
#
# 08:30 (owner, 2026-11-16: the scanner must be collecting the exchange's pre-open trial prices
# from 08:30, twscan/preopen.py, so that he can decide at 09:00). The schedule cannot promise
# that: on 2026-11-16 the first of the 05:00-08:45 crons started at 08:39, and the evening crons
# of 11-13 started eight hours late. What does arrive on time is the owner's phone: it uploads
# the 運彩 feed at 08:00 Taipei every day (data/tw/**, tw.yml), and a push starts a run within
# seconds. So that upload also starts this workflow: job `gate` lets it through on a weekday
# morning only, waits until 08:18 (a job may run 6 hours: started at 08:00 it would have to hand
# over at 13:40) and skips when another run of this workflow is already at work. The crons stay
# as the fallback for a day without an upload.

on:
  push:
    branches: [main]
    paths: ["data/tw/**"]
  schedule:
    # Taipei = UTC+8, so Taipei's weekday mornings before 08:00 are UTC Sunday-Thursday.
    - cron: "0,20,40 21-23 * * 0-4"  # 05:00-07:40 Taipei, Monday-Friday
    - cron: "0,15,30,45 0 * * 1-5"   # 08:00-08:45 Taipei
    - cron: "10,40 1-5 * * 1-5"      # 09:10-13:40 Taipei: backups
    - cron: "45 8 * * 1-5"           # 16:45 Taipei: institutional data, closing list, review
    - cron: "30 9 * * 1-5"           # 17:30 Taipei
    - cron: "15 11 * * 1-5"          # 19:15 Taipei: anything published late
  workflow_dispatch:

permissions:
  contents: write   # push the stock-data branch
  actions: write    # start the next run (workflow_dispatch) when this one hits its time limit; read the run list (gate)

jobs:
  # Runs started by the phone's upload: only a weekday morning has work for the scanner.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Decide whether this run scans
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          go=true
          if [ "$EVENT" = "push" ]; then
            now() { TZ=Asia/Taipei date +"$1"; }
            hm=$(( 10#$(now %H) * 60 + 10#$(now %M) ))
            # Monday-Friday, 05:00-14:10 Taipei: the trading session. Any other upload (20:00, weekends): nothing to do.
            if [ "$(now %u)" -gt 5 ] || [ "$hm" -lt 300 ] || [ "$hm" -ge 850 ]; then
              go=false
            else
              if [ "$hm" -lt 498 ]; then
                echo "Upload at $(now %H:%M): waiting until 08:18 Taipei to start the session"
                sleep $(( (498 - hm) * 60 - 10#$(now %S) ))
              fi
              # Another run of this workflow already at work (the other upload of the same minute, which has the
              # lower run id, or a scheduled / handed-over run): this one is not needed.
              busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow stock.yml --limit 30 \
                       --json databaseId,status,event \
                       --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID and (.databaseId < $GITHUB_RUN_ID or .event != \"push\"))] | length" \
                     || echo 0)
              if [ "${busy:-0}" -gt 0 ]; then go=false; fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT go=$go"

  scan:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One scanner at a time; a later run waits here (and takes over when this one ends).
    concurrency:
      group: stock
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the scanner's state
        uses: actions/cache/restore@v4
        with:
          path: stock/data
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-
      - name: Check out the published data (branch stock-data)
        run: |
          git config --global user.name "sports-analyzer bot"
          git config --global user.email "actions@users.noreply.github.com"
          PUB="$RUNNER_TEMP/stock-pub"
          if git ls-remote --exit-code --heads origin stock-data > /dev/null; then
            git fetch --depth 1 origin stock-data
            git worktree add --detach "$PUB" FETCH_HEAD
          else
            git worktree add --orphan -b stock-data "$PUB"
          fi
          echo "PUB=$PUB" >> "$GITHUB_ENV"
      - name: Run the scanner
        id: scan
        env:
          # Its own secret, so that setting it does not also turn on the sports pushes (NTFY_TOPIC)
          NTFY_TOPIC: ${{ secrets.STOCK_NTFY_TOPIC }}
          # The owner's Google Apps Script relay (stock/relay/Code.gs): prices every 10 seconds
          STOCK_RELAY_URL: ${{ secrets.STOCK_RELAY_URL }}
          PYTHONUNBUFFERED: "1"
        run: python stock/cloud.py --publish-dir "$PUB"
      - name: Hand over to the next run (the session is not over yet)
        if: steps.scan.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock.yml --ref "${{ github.ref_name }}"
      - name: Save the scanner's state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock/data
          key: stock-state-${{ github.run_id }}
