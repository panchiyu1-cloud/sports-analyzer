name: Daily analysis

on:
  schedule:
    # 00:15 UTC = 08:15 台北時間 — football fixtures + odds for the next two days
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Fixture window in days"
        default: "2"
        required: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run starts from the newest commit, not the one that triggered it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh this season's football-data.co.uk CSVs (results, xG, shots)
        continue-on-error: true
        run: bash scripts/refresh_history.sh

      - name: Football — fetch, model, cards, ledger
        run: python -m sports_analyzer.pipeline football --days "${{ github.event.inputs.days || '2' }}"

      - name: MLB — schedule, market consensus, T-10 G value
        continue-on-error: true
        run: python -m sports_analyzer.pipeline mlb

      - name: 運彩 — compare the latest phone upload with fair odds
        continue-on-error: true
        run: python -m sports_analyzer.pipeline tw

      - name: Post-match review of finished games
        continue-on-error: true
        run: python -m sports_analyzer.pipeline review

      - name: Render page
        run: python -m sports_analyzer.pipeline render

      - name: Commit snapshot, ledgers and page
        run: |
          bash scripts/commit_generated.sh "chore(daily): $(date -u +%Y-%m-%d) snapshot + page" data/snapshots data/ledger.csv data/tw_ledger.csv data/tw data/reviews data/history docs/index.html docs/reviews.html
