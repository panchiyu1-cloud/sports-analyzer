name: Probe odds sources (temporary)

# Runs only on the temporary probe branch: checks which public odds sources a browser
# on the Pages site can read, and keeps trimmed samples on this branch.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python probe/probe.py
      - name: Keep the results on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "chore(probe): results [skip ci]" || exit 0
          git push
