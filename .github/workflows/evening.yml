name: Evening football odds

# 12:25 UTC = 20:25 台北: a second, cheaper international snapshot (h2h only,
# 1 credit per competition with fixtures) a few hours before European
# kick-offs and before the next MLB first pitches. It gives the 運彩 bets taken in the morning their closing-line
# value, and the 20:00 phone upload a fresh fair price to compare against.

on:
  schedule:
    - cron: "25 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run starts from the newest commit, not the one that triggered it
          fetch-depth: 60  # enough history to date the 運彩 uploads (fetch/taiwan.normalize_uploads)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Football — fresh h2h consensus (fills CLV for morning 運彩 bets)
        run: python -m sports_analyzer.pipeline football --days 1 --markets h2h
      # Tomorrow-morning (Taipei) MLB games: lines are posted by now, and this
      # is what the 20:00 baseball upload is compared against. ~3 credits.
      - name: MLB — refresh odds for the next Taipei morning
        run: python -m sports_analyzer.pipeline mlb
      - name: Compare the latest 運彩 upload against it
        run: python -m sports_analyzer.pipeline tw
      # The morning's MLB game is final by now; afternoon football too on weekends.
      - name: Post-match review of finished games
        continue-on-error: true
        run: python -m sports_analyzer.pipeline review
      - name: Commit
        run: |
          bash scripts/commit_generated.sh "chore(evening): $(date -u +%Y-%m-%d) h2h snapshot + 運彩 compare" data/snapshots data/ledger.csv data/tw_ledger.csv data/tw data/reviews docs/index.html docs/reviews.html
