name: Probe Taiwan Sports Lottery feed

# One-off diagnostic: can a GitHub runner reach the official pre-match JSON feed,
# and which feed URLs does the site's front end actually load? Results are
# committed under probe/ so they can be read without the Actions log API.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plain HTTP probes
        run: |
          mkdir -p probe
          : > probe/http.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for u in \
            "https://blob.sportslottery.com.tw/apidata/Live/On.json" \
            "https://blob3rd.sportslottery.com.tw/apidata/Pre/34731.1-Games.zh.json" \
            "https://blob3rd.sportslottery.com.tw/apidata/Pre/Sports.zh.json" \
            "https://blob3rd.sportslottery.com.tw/apidata/Pre/Leagues.zh.json" \
            "https://www.sportslottery.com.tw/" ; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -A "$UA" -H "Accept: application/json,text/html" -H "Referer: https://www.sportslottery.com.tw/" --max-time 30 "$u" || echo "ERR")
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            echo "== $u -> HTTP $code, $size bytes" | tee -a probe/http.txt
            head -c 600 /tmp/body >> probe/http.txt 2>/dev/null || true
            echo >> probe/http.txt
          done

      - name: Browser probe (capture network URLs the site loads)
        continue-on-error: true
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          python - <<'EOF'
          import json, re
          from playwright.sync_api import sync_playwright
          urls, bodies = [], {}
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(locale="zh-TW", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
              page = ctx.new_page()
              def on_response(resp):
                  u = resp.url
                  if "sportslottery" in u and ("json" in u.lower() or "api" in u.lower()):
                      urls.append(f"{resp.status} {u}")
                      if resp.status == 200 and len(bodies) < 12:
                          try:
                              txt = resp.text()
                              bodies[u] = txt[:1500]
                          except Exception as e:
                              bodies[u] = f"<unreadable: {e}>"
              page.on("response", on_response)
              try:
                  page.goto("https://www.sportslottery.com.tw/", wait_until="networkidle", timeout=90000)
              except Exception as e:
                  urls.append(f"goto error: {e}")
              # try to click into 足球 / 棒球 sections if present
              for label in ("足球", "棒球", "賽前"):
                  try:
                      page.get_by_text(label, exact=False).first.click(timeout=5000)
                      page.wait_for_timeout(4000)
                  except Exception as e:
                      urls.append(f"click {label} failed: {type(e).__name__}")
              page.wait_for_timeout(3000)
              b.close()
          with open("probe/network.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(dict.fromkeys(urls)) + "\n\n=== sample bodies ===\n")
              for u, t in bodies.items():
                  fh.write(f"\n--- {u}\n{t}\n")
          print("\n".join(dict.fromkeys(urls)))
          EOF

      - name: Commit probe results
        run: |
          git config user.name "sports-analyzer bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "chore(probe): Taiwan Sports Lottery feed reachability" || echo "nothing to commit"
          git push
