name: Post-match review

# Manual run of the 賽後檢討 step: results from football-data.org and the MLB
# Stats API, statistics from football-data.co.uk. Costs no Odds API credits.
# The daily (08:15 台北) and evening (20:25) runs do the same step automatically.

on:
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh this season's football-data.co.uk CSVs
        continue-on-error: true
        run: bash scripts/refresh_history.sh
      - name: Review finished games and render
        run: python -m sports_analyzer.pipeline review
      - name: Commit
        run: |
          bash scripts/commit_generated.sh "chore(review): $(date -u +%Y-%m-%d) post-match review" data/reviews data/history data/ledger.csv data/tw_ledger.csv data/moves docs
