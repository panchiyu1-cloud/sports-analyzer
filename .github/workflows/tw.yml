name: 運彩 compare

# Runs whenever the phone uploads a 運彩 feed file (data/tw/**). Needs no API
# keys: it compares the upload with the latest snapshots and re-renders.

on:
  push:
    paths:
      - "data/tw/**"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare 運彩 with fair odds and render
        run: python -m sports_analyzer.pipeline tw
      - name: Commit
        run: |
          git config user.name "sports-analyzer bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots data/tw_ledger.csv docs/index.html
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "chore(tw): compare upload with fair odds"
            git pull --rebase origin main || true
            git push
          fi
