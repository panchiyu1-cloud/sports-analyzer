name: 運彩 compare

# Runs whenever the phone uploads a 運彩 feed file (data/tw/**). Compares the upload
# with the latest snapshots and re-renders. Games starting within the next 3 hours
# first get freshly bought international prices (T-10 價值版: decide just before
# first pitch), within the odds credit budget; that is what the API key is for.

on:
  push:
    paths:
      - "data/tw/**"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run starts from the newest commit, not the one that triggered it
          fetch-depth: 60  # enough history to date the 運彩 uploads (fetch/taiwan.normalize_uploads)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare 運彩 with fair odds (pre-game refresh first) and render
        run: python -m sports_analyzer.pipeline tw
      - name: Commit
        run: |
          bash scripts/commit_generated.sh "chore(tw): compare upload with fair odds" data/snapshots data/tw_ledger.csv data/odds_budget.json data/tw docs/index.html docs/reviews.html
