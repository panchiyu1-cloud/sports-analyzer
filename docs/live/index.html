<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1630">
<title>即時精選｜比賽分析</title>
<meta name="description" content="即時賠率變化，依 EV、價格新鮮度、盤口移動排出目前最值得看的 10 場比賽與下注方式">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* 這一頁是手寫的單頁應用（和 docs/cfd 一樣）：index.html（畫面）、engine.js（運算）、app.js（抓資料、畫畫面）。
     data.json 由 pipeline 每次 render 產生。顏色沿用主站的「夜場轉播」。 */
  :root {
    color-scheme: dark;
    --sky: #0A1630; --sky-2: #0D2140; --turf: #0B2A28; --panel: rgba(15, 30, 56, .86); --panel-2: rgba(255, 255, 255, .04);
    --line: rgba(150, 185, 230, .15); --line-2: rgba(150, 185, 230, .3);
    --ink: #EAF3FF; --ink-2: #B7C6DB; --ink-3: #8195B0;
    --intl: #2A93D8; --tw: #CC7F1A; --ref: #9FB4D1;
    --good: #3DDC84; --good-fill: #177A47; --warn: #F2B95A; --warn-fill: #8A5A12;
    --bad: #FF7A7A; --bad-fill: #B23A3A; --neutral-fill: #2B3B57;
    --num: "Barlow Condensed", "PingFang TC", "Noto Sans TC", sans-serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.6 var(--sans);
    background: radial-gradient(70vmax 40vmax at 4% -8%, rgba(165, 214, 255, .22), transparent 60%),
      radial-gradient(60vmax 36vmax at 99% -12%, rgba(165, 214, 255, .15), transparent 58%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 44%, var(--turf) 100%) fixed; }
  a { color: #8CCBF5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .muted { color: var(--ink-3); } .pos { color: var(--good); } .neg { color: var(--bad); } .amber { color: var(--warn); }

  /* 頁首：品牌、即時狀態、分頁 */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(10, 22, 48, .93); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; max-width: 980px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 800; letter-spacing: .04em; }
  .brand svg { width: 24px; height: 24px; }
  .brand small { color: var(--ink-3); font-weight: 500; }
  .pulse { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.on { background: var(--good); box-shadow: 0 0 0 0 rgba(61, 220, 132, .7); animation: ping 2s infinite; }
  .dot.off { background: var(--bad); }
  @keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }
  .tabs { display: flex; gap: 6px; padding: 4px 16px 10px; max-width: 980px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--ink-2); cursor: pointer; font-size: .9rem; }
  .tabs button[aria-selected="true"] { color: #fff; background: rgba(42, 147, 216, .28); border-color: rgba(42, 147, 216, .7); }
  .tabs .count { font-family: var(--num); margin-left: 4px; color: var(--ink-3); }

  /* 標題區 */
  .hero { padding: 20px 0 6px; }
  .hero h1 { font-size: clamp(1.5rem, 6vw, 2.2rem); line-height: 1.15; margin: 0 0 6px; font-weight: 800; letter-spacing: .02em; }
  .hero p { margin: 0 0 12px; color: var(--ink-2); font-size: .92rem; max-width: 46em; }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .src { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--panel-2); }
  .src b { color: var(--ink); font-weight: 600; }
  .src .dot { width: 6px; height: 6px; animation: none; }

  /* 比賽卡 */
  .cards { display: grid; gap: 12px; padding-bottom: 32px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
  .card[data-grade="A"] { border-color: rgba(61, 220, 132, .65); box-shadow: 0 0 0 1px rgba(61, 220, 132, .25), 0 10px 30px rgba(23, 122, 71, .25); }
  .card[data-grade="B"] { border-color: rgba(242, 185, 90, .5); }
  .head { display: flex; align-items: flex-start; gap: 10px; }
  .rank { flex: none; width: 34px; font: 700 1.9rem/1 var(--num); color: var(--ink-3); text-align: center; padding-top: 2px; }
  .card[data-grade="A"] .rank { color: var(--good); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .8rem; color: var(--ink-2); }
  .lg { font-weight: 700; color: #fff; background: var(--neutral-fill); padding: 1px 8px; border-radius: 6px; }
  .teams { margin: 4px 0 2px; font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
  .teams small { display: block; font-size: .76rem; font-weight: 400; color: var(--ink-3); }
  .grade { margin-left: auto; flex: none; text-align: right; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .chip.A { background: var(--good-fill); color: #fff; } .chip.B { background: var(--warn-fill); color: #fff; }
  .chip.C { background: rgba(42, 147, 216, .35); color: #fff; } .chip.W { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-2); }
  .chip.D { background: var(--neutral-fill); color: var(--ink-2); }
  .score { display: block; font: 600 .8rem var(--num); color: var(--ink-3); margin-top: 3px; }
  .pickline { margin: 10px 0 8px; padding: 9px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .pickline .what { font-weight: 700; font-size: 1.02rem; }
  .pickline .big { font: 700 1.5rem/1 var(--num); }
  .pickline .lbl { font-size: .74rem; color: var(--ink-3); margin-right: 4px; }

  /* 即時賠率：每個選項一格（參考盤現價、變化、公允、運彩） */
  .odds { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 8px 0; }
  .cell { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: rgba(0, 0, 0, .14); min-width: 0; }
  .cell .side { font-size: .76rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .now { font: 700 1.35rem/1.1 var(--num); display: flex; align-items: baseline; gap: 6px; }
  .cell .delta { font: 600 .8rem var(--num); }
  .cell .cap { font-size: .66rem; color: var(--ink-3); margin: -1px 0 3px; }
  .cell .row { display: flex; justify-content: space-between; font-size: .74rem; color: var(--ink-3); }
  .cell .row b { font: 600 .9rem var(--num); color: var(--ink); }
  .cell .row b.tw { color: var(--warn); } .cell .row b.fair { color: #8CCBF5; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: rgba(242, 185, 90, .45); } 100% { background: rgba(0, 0, 0, .14); } }
  .plan { margin: 8px 0 0; padding: 0; list-style: none; font-size: .9rem; }
  .plan li { padding-left: 18px; position: relative; color: var(--ink-2); }
  .plan li::before { content: "›"; position: absolute; left: 4px; color: var(--ink-3); }
  .plan li:first-child { color: var(--ink); font-weight: 600; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: .86rem; color: var(--ink); text-decoration: none; }
  .btn:hover { border-color: var(--intl); }
  .btn.pri { background: rgba(42, 147, 216, .3); border-color: rgba(42, 147, 216, .8); }
  .btn.ok { background: var(--good-fill); border-color: var(--good); }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { font-size: .8rem; color: var(--warn); margin: 6px 0 0; }

  /* 分析（展開） */
  .detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-weight: 500; color: var(--ink-3); font-size: .76rem; }
  td.r, th.r { text-align: right; } td.n { font-family: var(--num); font-size: 1rem; text-align: right; }
  tr.on td { background: rgba(61, 220, 132, .08); }
  td input { width: 4.6em; background: rgba(0, 0, 0, .25); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px; text-align: right; font-family: var(--num); font-size: 1rem; }
  .tag { font-size: .7rem; border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; color: var(--ink-3); margin-left: 4px; }
  .spark { width: 100%; height: 86px; display: block; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .74rem; color: var(--ink-3); }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 4px; }
  .sub { font-size: .8rem; color: var(--ink-3); margin: 6px 0 0; }

  /* 全部比賽、追蹤、設定 */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .filters button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; color: var(--ink-2); cursor: pointer; font-size: .82rem; }
  .filters button[aria-pressed="true"] { color: #fff; border-color: var(--intl); background: rgba(42, 147, 216, .22); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 0 0 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kpi b { display: block; font: 700 1.6rem/1.1 var(--num); } .kpi span { font-size: .76rem; color: var(--ink-3); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 1.02rem; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 14px; }
  .form label { display: block; font-size: .8rem; color: var(--ink-2); }
  .form input, .form select, textarea { width: 100%; margin-top: 3px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 9px; }
  textarea { min-height: 70px; font-size: .78rem; }
  .empty { text-align: center; padding: 34px 12px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 14px; }
  .empty b { display: block; font-size: 1.05rem; color: var(--ink); margin-bottom: 4px; }
  .foot.wrap { color: var(--ink-3); font-size: .78rem; padding: 6px 16px 40px; }
  @media (max-width: 520px) { .rank { width: 26px; font-size: 1.5rem; } .card { padding: 12px; } }
  @media (prefers-reduced-motion: reduce) { .dot.on, .flash { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="../index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#2A93D8" stroke-width="2.4"/><path d="M9.5 6.6c3 2.6 4.7 5.9 4.7 9.4s-1.7 6.8-4.7 9.4M22.5 6.6c-3 2.6-4.7 5.9-4.7 9.4s1.7 6.8 4.7 9.4" fill="none" stroke="#CC7F1A" stroke-width="2"/></svg><span>比賽分析 <small>即時精選</small></span></a>
    <span class="pulse" id="pulse"><i class="dot"></i><span>載入中…</span></span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="分頁"></nav>
</header>
<main class="wrap" id="app"><p class="sub" style="padding:30px 0">載入中…</p></main>
<footer class="foot wrap">時間都是台灣時間。公允價 = 多家國際莊家去水後的中位數（The Odds API）；即時參考盤 = ESPN 上一家莊家的現價，只用來看「盤有沒有動」。EV = 公允機率 × 運彩賠率 − 1。數字是機率估計，不是保證；長期只有運彩賠率高於公允價的注有正期望值。<a href="../index.html">回到各分析方法</a></footer>
<script src="engine.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
