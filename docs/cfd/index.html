<!DOCTYPE html>
<!-- 差價交易分析網頁：獨立的單檔工具，手動放在這裡給 GitHub Pages 提供，不是 sports-analyzer 排程產生的檔案，請勿刪除。原始碼與開發筆記在 claude.ai 專案「經濟分析」。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="差價分析">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f3f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1322">
<title>差價交易分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f1f3f8; --surface: #ffffff; --surface2: #e9edf4; --line: #d9dfe9;
  --text: #131c2e; --text2: #475269; --muted: #68748a;
  --red: #d9423a; --green: #0f8f6a; --blue: #2a78d6;
  --up: var(--red); --down: var(--green);
  --num: "Barlow Semi Condensed", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0c1322; --surface: #131c2e; --surface2: #1b2742; --line: #2a3857;
    --text: #e9eef7; --text2: #aab5ca; --muted: #8391aa;
    --red: #ec5f59; --green: #1fa37a; --blue: #4a90e8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1322; --surface: #131c2e; --surface2: #1b2742; --line: #2a3857;
  --text: #e9eef7; --text2: #aab5ca; --muted: #8391aa;
  --red: #ec5f59; --green: #1fa37a; --blue: #4a90e8;
}
:root[data-swap="1"] { --up: var(--green); --down: var(--red); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--text2); }
small { font-size: 12.5px; }
[hidden] { display: none !important; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 6px; max-width: 1180px; margin: 0 auto; }
.top h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .04em; }
.top-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 14px; }
.btn:active { background: var(--surface2); }
.btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); font-weight: 600; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

#banner:empty { display: none; }
#banner { max-width: 1180px; margin: 4px auto 0; padding: 0 12px; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--text); background: var(--surface); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.notice.demo { border-left-color: var(--blue); }
.notice p { margin: 0 0 6px; } .notice p:last-child { margin: 0; }

main { max-width: 1180px; margin: 0 auto; padding: 8px 12px 24px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 2px 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 10px; }
.card > h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card > h2 small { font-weight: 400; color: var(--muted); }

/* 掃描列表 */
.list { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1.25fr) 52px minmax(0, 1fr) auto; grid-template-areas: "name spark price sig" "lv lv lv lv"; align-items: center; column-gap: 10px; row-gap: 4px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.row:active { background: var(--surface2); }
.r-name { grid-area: name; min-width: 0; } .r-name b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .r-name small { color: var(--muted); font-family: var(--num); }
.r-spark { grid-area: spark; color: var(--text2); display: flex; }
.r-price { grid-area: price; text-align: right; } .r-price b { display: block; font-size: 17px; font-weight: 600; font-family: var(--num); font-variant-numeric: tabular-nums; } .r-price small { font-family: var(--num); }
.r-sig { grid-area: sig; text-align: right; min-width: 76px; } .r-sig small { display: block; color: var(--text2); font-family: var(--num); margin-top: 2px; }
.r-lv { grid-area: lv; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 12px; border-top: 1px dashed var(--line); padding-top: 5px; }
.r-lv .num { color: var(--text2); }
.row.err { grid-template-areas: "name lv lv lv"; } .row.err .r-lv { border: 0; padding: 0; }
.badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.badge.strong { color: var(--surface); } .badge.strong.up { background: var(--up); border-color: var(--up); } .badge.strong.down { background: var(--down); border-color: var(--down); }
.grp { font-size: 13px; color: var(--muted); margin: 12px 2px 2px; font-weight: 600; }

/* 分析頁 */
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.d-head select { max-width: 56%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 16px; font-weight: 600; }
.d-price { text-align: right; line-height: 1.15; } .d-price .big { font-size: 28px; font-weight: 700; display: block; } .d-price small { font-family: var(--num); font-size: 14px; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 14px; }
@media (min-width: 1020px) { .d-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }

.verdict { display: grid; gap: 10px; }
.v-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.v-label { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.v-label .gl { font-size: 20px; }
.v-reg { color: var(--text2); font-size: 13px; text-align: right; }
.pbar { display: flex; gap: 2px; height: 12px; } .pbar i { display: block; height: 100%; border-radius: 4px; } .pbar .a { background: var(--up); } .pbar .b { background: var(--down); }
.pbar-lab { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text2); margin-top: 4px; } .pbar-lab b { color: var(--text); font-family: var(--num); font-size: 17px; }
.outlook { margin: 0; font-size: 15px; }
.warns { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.warns li { padding-left: 22px; position: relative; color: var(--text2); } .warns li::before { content: "!"; position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; font-weight: 800; line-height: 13px; text-align: center; }
.warns li.hot { color: var(--text); font-weight: 600; }
details > summary { cursor: pointer; font-size: 14px; color: var(--text2); padding: 4px 0; }
.parts { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 4px; } .parts td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; } .parts td:nth-child(2) { text-align: right; white-space: nowrap; padding-left: 10px; font-family: var(--num); font-weight: 600; } .parts small { color: var(--muted); display: block; }

.chart-wrap { position: relative; } canvas#cv { display: block; width: 100%; height: 370px; touch-action: pan-y; border-radius: 6px; }
@media (min-width: 700px) { canvas#cv { height: 440px; } }
.c-info { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text2); min-height: 40px; display: flex; flex-wrap: wrap; gap: 0 12px; align-content: flex-start; margin-bottom: 4px; } .c-info span { white-space: nowrap; }
.c-info b { color: var(--text); font-weight: 600; }
.c-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--text2); } .legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--text2); } .legend i.e20 { border-color: var(--blue); } .legend i.el { border-top-style: dashed; } .legend i.zn { height: 9px; border: 1px solid var(--text2); background: color-mix(in srgb, var(--text2) 18%, transparent); } .legend i.pj { height: 9px; border: 0; border-top: 2px dashed var(--blue); background: color-mix(in srgb, var(--blue) 16%, transparent); }
.legend i.cu { width: 7px; height: 11px; border: 0; background: var(--up); } .legend i.cd { width: 7px; height: 11px; border: 1.5px solid var(--down); }
.zoom { display: flex; gap: 4px; }

/* 價位梯 */
.ladder { display: grid; }
.lv { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 74px; align-items: center; column-gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.lv:first-child { border-top: 0; }
.lv .tg { font-weight: 700; font-size: 13px; text-align: center; border: 1.5px solid var(--text2); border-radius: 5px; padding: 1px 0; }
.lv .px { font-family: var(--num); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; } .lv .px small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.lv .ds { font-family: var(--num); color: var(--text2); font-size: 14px; text-align: right; }
.lv .why { grid-column: 2 / -1; color: var(--muted); font-size: 12.5px; }
.meter { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); justify-content: flex-end; } .meter i { display: block; width: 40px; height: 6px; border-radius: 3px; background: var(--surface2); position: relative; overflow: hidden; } .meter i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--text2); border-radius: 3px; }
.lv.now { background: var(--text); color: var(--surface); border-radius: 8px; border-top: 0; padding: 8px 10px; margin: 4px -4px; grid-template-columns: auto 1fr auto; } .lv.now + .lv { border-top: 0; }
.lv.now .px { font-size: 21px; font-weight: 700; } .lv.now span:first-child { font-weight: 700; font-size: 13px; } .lv.now .ds { color: inherit; opacity: .8; font-size: 12.5px; }

/* 進場計畫 */
.plan { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 8px; }
.plan.sel { border: 2px solid var(--text); padding: 11px; }
.plan header { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 8px; }
.plan h3 { font-size: 16px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.plan .star { background: var(--text); color: var(--surface); font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.plan .ty { color: var(--muted); font-size: 12.5px; }
.plan .vd { margin-left: auto; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 4px; border: 1.5px solid var(--text2); color: var(--text2); } .plan .vd.ok { border-color: var(--text); color: var(--text); } .plan .vd.no { border-style: dashed; font-weight: 500; }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0; }
.pgrid div { background: var(--surface2); border-radius: 6px; padding: 6px 8px; min-width: 0; } .pgrid dt { font-size: 12px; color: var(--muted); } .pgrid dd { margin: 0; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; white-space: nowrap; } .pgrid dd small { display: block; font-weight: 500; color: var(--text2); font-size: 12px; }
@media (max-width: 420px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; text-align: center; } .pstats b { display: block; font-family: var(--num); font-size: 18px; font-weight: 700; } .pstats span { font-size: 12px; color: var(--muted); }
.pnote { margin: 8px 0 0; font-size: 13.5px; color: var(--text2); }
.plan .btn { margin-top: 8px; }
.calc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .calc label { font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; } .calc input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 8px; font-family: var(--num); font-size: 16px; }
.calc-out { margin: 10px 0 0; font-size: 14px; color: var(--text2); } .calc-out b { color: var(--text); font-family: var(--num); }

.mtf { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; } .mtf div { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; } .mtf div.cur { border: 2px solid var(--text); padding: 5px 1px; } .mtf small { display: block; color: var(--muted); font-size: 12px; } .mtf b { font-size: 14px; }
.kv { width: 100%; border-collapse: collapse; font-size: 13.5px; } .kv td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; } .kv tr:first-child td { border-top: 0; } .kv td:nth-child(2) { font-family: var(--num); text-align: right; padding: 6px 8px; white-space: nowrap; } .kv td:last-child { text-align: right; white-space: nowrap; } .kv small { display: block; color: var(--muted); }
.dir { font-weight: 700; font-size: 13px; }
.stl { display: grid; } .st { padding: 8px 0; border-top: 1px solid var(--line); } .st:first-child { border-top: 0; padding-top: 0; } .st div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; } .st b { font-weight: 600; } .st small { color: var(--muted); display: block; margin-top: 2px; }
.plain { margin: 0; padding-left: 18px; font-size: 14px; } .plain li { margin: 3px 0; } .none { color: var(--muted); font-size: 14px; margin: 0; }
.nlist { list-style: none; margin: 0; padding: 0; } .nlist li { padding: 9px 0; border-top: 1px solid var(--line); } .nlist li:first-child { border-top: 0; } .nlist a { color: var(--text); text-decoration: none; font-size: 14.5px; } .nlist a:hover { text-decoration: underline; } .nlist .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--muted); font-size: 12.5px; margin-top: 3px; align-items: center; }
.fx { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--text2); white-space: nowrap; }
.cal { width: 100%; border-collapse: collapse; font-size: 14px; } .cal td { padding: 7px 4px 7px 0; border-top: 1px solid var(--line); vertical-align: top; } .cal .t { font-family: var(--num); white-space: nowrap; color: var(--text2); } .cal .imp { font-weight: 700; font-size: 12px; border: 1.5px solid var(--text); border-radius: 4px; padding: 0 5px; white-space: nowrap; } .cal .imp.m { border-color: var(--muted); color: var(--muted); font-weight: 500; } .cal tr.past td { opacity: .5; }
.foot { color: var(--muted); font-size: 12.5px; margin: 14px 2px 0; }
.form { display: grid; gap: 14px; } .form .f { display: grid; gap: 6px; } .form .f > span { font-size: 14px; font-weight: 600; } .form .f small { color: var(--muted); } .seg { display: flex; gap: 6px; flex-wrap: wrap; }
.form input[type="text"], .form input[type="number"], .form select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 8px; font-size: 16px; min-width: 0; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .three label { font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; } .three input, .three select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 8px; font-size: 16px; }
.diag { font-size: 13px; width: 100%; border-collapse: collapse; } .diag td { padding: 5px 6px 5px 0; border-top: 1px solid var(--line); vertical-align: top; word-break: break-word; }
.loading { color: var(--muted); padding: 28px 0; text-align: center; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabs button { background: none; border: 0; padding: 14px 4px 13px; font-size: 15px; color: var(--muted); border-top: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 700; border-top-color: var(--text); }
@media (min-width: 1020px) { .tabs { position: static; max-width: 520px; margin: 0 auto; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; } body { padding-bottom: 24px; } .tabs button { padding: 9px 4px; } }
@media (prefers-reduced-motion: no-preference) { .row, .chip, .btn { transition: background-color .12s; } }

/* 評級、精選卡片、追蹤與提醒 */
.tabs .tb { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; font: 700 12px/18px var(--num); background: var(--surface2); color: var(--text); vertical-align: 1px; }
.tabs .tb.hot { background: var(--text); color: var(--surface); }
#toasts { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 20; display: grid; gap: 6px; max-width: 560px; margin: 0 auto; pointer-events: none; }
.toast { pointer-events: auto; background: var(--text); color: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
.toast .btn { background: transparent; color: inherit; border-color: currentColor; flex: 0 0 auto; }
.toast.info { background: var(--surface); color: var(--text); border: 1px solid var(--text); }
.grade { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; font: 700 17px/1 var(--num); border: 2px solid var(--text); color: var(--text); flex: 0 0 auto; }
.grade.gA { background: var(--text); color: var(--surface); }
.grade.gC { border: 1.5px solid var(--muted); color: var(--text2); }
.grade.gD { border: 1.5px dashed var(--muted); color: var(--muted); }
.r-lv .grade { width: 20px; height: 20px; font-size: 13px; border-width: 1.5px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
.t-open { display: grid; grid-template-columns: 24px minmax(0, 1.25fr) 52px minmax(0, 1fr); align-items: center; column-gap: 10px; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.t-rank { font-size: 22px; font-weight: 700; color: var(--muted); text-align: center; }
.t-rate { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; }
.t-rate b, .v-rate b { font-size: 16px; } .t-sc { margin-left: auto; color: var(--text2); }
.t-act { margin: 8px 0; font-size: 15px; } .t-act small { display: block; color: var(--muted); }
.t-btns { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .t-plan { color: var(--text2); font-size: 13.5px; }
.t-sum { margin: 2px 2px 4px; font-size: 14.5px; }
.st-chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--text2); white-space: nowrap; } .st-chip.on { border-color: var(--text); color: var(--text); font-weight: 600; }
.v-rate { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 14.5px; padding: 8px 10px; background: var(--surface2); border-radius: 8px; }
.pos { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 8px; }
.pos header { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .pos h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }

<script>
/* ===== 分析引擎：技術指標、型態、支撐阻力、歷史比對、策略回測、進場計畫 ===== */
(function (root) {
'use strict';
const E = {};
const isNum = v => typeof v === 'number' && isFinite(v);
const clip = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);
const mean = a => { let s = 0, n = 0; for (const v of a) if (isNum(v)) { s += v; n++; } return n ? s / n : NaN; };
const logit = p => Math.log(p / (1 - p));
const sigmoid = x => 1 / (1 + Math.exp(-x));
const median = a => { const b = a.filter(isNum).sort((x, y) => x - y); if (!b.length) return NaN; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const quantile = (a, q) => { const b = a.filter(isNum).sort((x, y) => x - y); if (!b.length) return NaN; const p = (b.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return b[lo] + (b[hi] - b[lo]) * (p - lo); };
E.util = { isNum, clip, sign, mean, logit, sigmoid, median, quantile };

E.TF = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '30m': 1800e3, '1h': 3600e3, '4h': 14400e3, '1d': 86400e3 };
E.TF_LIST = ['1m', '5m', '15m', '30m', '1h', '4h'];
E.TF_NAME = { '1m': '1分', '5m': '5分', '15m': '15分', '30m': '30分', '1h': '1小時', '4h': '4小時', '1d': '日線' };
E.HORIZON = 12; // 預測視野（根K線）

/* ---------- 基礎運算 ---------- */
E.sma = (a, n) => {
  const out = new Array(a.length).fill(NaN); let s = 0, cnt = 0;
  for (let i = 0; i < a.length; i++) {
    if (isNum(a[i])) { s += a[i]; cnt++; }
    if (i >= n && isNum(a[i - n])) { s -= a[i - n]; cnt--; }
    if (cnt === n) out[i] = s / n;
  }
  return out;
};
E.ema = (a, n) => {
  const out = new Array(a.length).fill(NaN); const k = 2 / (n + 1); let e = NaN, s = 0, cnt = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i]; if (!isNum(v)) continue;
    if (cnt < n) { s += v; cnt++; if (cnt === n) { e = s / n; out[i] = e; } }
    else { e = v * k + e * (1 - k); out[i] = e; }
  }
  return out;
};
E.rma = (a, n) => {
  const out = new Array(a.length).fill(NaN); let e = NaN, s = 0, cnt = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i]; if (!isNum(v)) continue;
    if (cnt < n) { s += v; cnt++; if (cnt === n) { e = s / n; out[i] = e; } }
    else { e = (e * (n - 1) + v) / n; out[i] = e; }
  }
  return out;
};
E.stdev = (a, n) => {
  const out = new Array(a.length).fill(NaN);
  for (let i = n - 1; i < a.length; i++) {
    let s = 0; for (let j = i - n + 1; j <= i; j++) s += a[j];
    const m = s / n; let q = 0; for (let j = i - n + 1; j <= i; j++) q += (a[j] - m) * (a[j] - m);
    out[i] = Math.sqrt(q / n);
  }
  return out;
};
E.rollMax = (a, n, excl) => { // excl=true：不含當根
  const out = new Array(a.length).fill(NaN);
  for (let i = 0; i < a.length; i++) {
    const end = excl ? i - 1 : i, st = end - n + 1; if (st < 0) continue;
    let m = -Infinity; for (let j = st; j <= end; j++) if (a[j] > m) m = a[j]; out[i] = m;
  }
  return out;
};
E.rollMin = (a, n, excl) => {
  const out = new Array(a.length).fill(NaN);
  for (let i = 0; i < a.length; i++) {
    const end = excl ? i - 1 : i, st = end - n + 1; if (st < 0) continue;
    let m = Infinity; for (let j = st; j <= end; j++) if (a[j] < m) m = a[j]; out[i] = m;
  }
  return out;
};

/* ---------- 技術指標 ---------- */
E.rsi = (c, n = 14) => {
  const up = [NaN], dn = [NaN];
  for (let i = 1; i < c.length; i++) { const d = c[i] - c[i - 1]; up.push(d > 0 ? d : 0); dn.push(d < 0 ? -d : 0); }
  const au = E.rma(up, n), ad = E.rma(dn, n);
  return c.map((_, i) => (isNum(au[i]) ? (ad[i] === 0 ? (au[i] === 0 ? 50 : 100) : 100 - 100 / (1 + au[i] / ad[i])) : NaN));
};
E.macd = (c, f = 12, s = 26, g = 9) => {
  const ef = E.ema(c, f), es = E.ema(c, s);
  const m = c.map((_, i) => (isNum(ef[i]) && isNum(es[i]) ? ef[i] - es[i] : NaN));
  const sg = E.ema(m, g);
  return { macd: m, signal: sg, hist: m.map((v, i) => (isNum(v) && isNum(sg[i]) ? v - sg[i] : NaN)) };
};
E.bollinger = (c, n = 20, k = 2) => {
  const mid = E.sma(c, n), sd = E.stdev(c, n);
  const up = mid.map((m, i) => m + k * sd[i]), lo = mid.map((m, i) => m - k * sd[i]);
  return {
    mid, up, lo,
    pctB: c.map((v, i) => (isNum(up[i]) && up[i] > lo[i] ? (v - lo[i]) / (up[i] - lo[i]) : NaN)),
    width: mid.map((m, i) => (isNum(m) && m ? (up[i] - lo[i]) / m : NaN)),
  };
};
E.trueRange = (h, l, c) => h.map((_, i) => (i === 0 ? h[i] - l[i] : Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]))));
E.atr = (h, l, c, n = 14) => E.rma(E.trueRange(h, l, c), n);
E.adx = (h, l, c, n = 14) => {
  const len = c.length, pdm = [NaN], mdm = [NaN];
  for (let i = 1; i < len; i++) {
    const up = h[i] - h[i - 1], dn = l[i - 1] - l[i];
    pdm.push(up > dn && up > 0 ? up : 0); mdm.push(dn > up && dn > 0 ? dn : 0);
  }
  const tr = E.trueRange(h, l, c); tr[0] = NaN;
  const atr = E.rma(tr, n), sp = E.rma(pdm, n), sm = E.rma(mdm, n);
  const pdi = atr.map((a, i) => (isNum(a) && a > 0 ? 100 * sp[i] / a : NaN));
  const mdi = atr.map((a, i) => (isNum(a) && a > 0 ? 100 * sm[i] / a : NaN));
  const dx = pdi.map((p, i) => (isNum(p) && isNum(mdi[i]) && p + mdi[i] > 0 ? 100 * Math.abs(p - mdi[i]) / (p + mdi[i]) : NaN));
  return { adx: E.rma(dx, n), pdi, mdi };
};
E.stoch = (h, l, c, n = 14, sk = 3, sd = 3) => {
  const hh = E.rollMax(h, n), ll = E.rollMin(l, n);
  const raw = c.map((v, i) => (isNum(hh[i]) ? (hh[i] > ll[i] ? 100 * (v - ll[i]) / (hh[i] - ll[i]) : 50) : NaN));
  const k = E.sma(raw, sk); return { k, d: E.sma(k, sd) };
};
E.cci = (h, l, c, n = 20) => {
  const tp = c.map((v, i) => (h[i] + l[i] + v) / 3), ma = E.sma(tp, n), out = new Array(c.length).fill(NaN);
  for (let i = n - 1; i < c.length; i++) {
    let md = 0; for (let j = i - n + 1; j <= i; j++) md += Math.abs(tp[j] - ma[i]); md /= n;
    out[i] = md > 0 ? (tp[i] - ma[i]) / (0.015 * md) : 0;
  }
  return out;
};
E.willr = (h, l, c, n = 14) => {
  const hh = E.rollMax(h, n), ll = E.rollMin(l, n);
  return c.map((v, i) => (isNum(hh[i]) ? (hh[i] > ll[i] ? -100 * (hh[i] - v) / (hh[i] - ll[i]) : -50) : NaN));
};
E.supertrend = (h, l, c, atr, mult = 3) => {
  const n = c.length, line = new Array(n).fill(NaN), dir = new Array(n).fill(0);
  let ub = NaN, lb = NaN, d = 1;
  for (let i = 0; i < n; i++) {
    if (!isNum(atr[i])) continue;
    const mid = (h[i] + l[i]) / 2; let bu = mid + mult * atr[i], bl = mid - mult * atr[i];
    if (isNum(ub)) {
      bu = (bu < ub || c[i - 1] > ub) ? bu : ub;
      bl = (bl > lb || c[i - 1] < lb) ? bl : lb;
      if (d === 1 && c[i] < bl) d = -1; else if (d === -1 && c[i] > bu) d = 1;
    }
    ub = bu; lb = bl; dir[i] = d; line[i] = d === 1 ? bl : bu;
  }
  return { line, dir };
};
E.psar = (h, l, step = 0.02, max = 0.2) => {
  const n = h.length, out = new Array(n).fill(NaN), dir = new Array(n).fill(0); if (n < 3) return { sar: out, dir };
  let up = h[1] >= h[0], af = step, ep = up ? h[1] : l[1], sar = up ? l[0] : h[0];
  for (let i = 2; i < n; i++) {
    sar = sar + af * (ep - sar);
    if (up) {
      sar = Math.min(sar, l[i - 1], l[i - 2]);
      if (l[i] < sar) { up = false; sar = ep; ep = l[i]; af = step; }
      else if (h[i] > ep) { ep = h[i]; af = Math.min(af + step, max); }
    } else {
      sar = Math.max(sar, h[i - 1], h[i - 2]);
      if (h[i] > sar) { up = true; sar = ep; ep = h[i]; af = step; }
      else if (l[i] < ep) { ep = l[i]; af = Math.min(af + step, max); }
    }
    out[i] = sar; dir[i] = up ? 1 : -1;
  }
  return { sar: out, dir };
};
E.ichimoku = (h, l, c) => {
  const mid = n => { const hh = E.rollMax(h, n), ll = E.rollMin(l, n); return hh.map((v, i) => (isNum(v) ? (v + ll[i]) / 2 : NaN)); };
  const tenkan = mid(9), kijun = mid(26), m52 = mid(52), n = c.length;
  const cloudA = new Array(n).fill(NaN), cloudB = new Array(n).fill(NaN); // 對應當根位置的雲（由 26 根前的值位移而來）
  for (let i = 26; i < n; i++) {
    if (isNum(tenkan[i - 26]) && isNum(kijun[i - 26])) cloudA[i] = (tenkan[i - 26] + kijun[i - 26]) / 2;
    if (isNum(m52[i - 26])) cloudB[i] = m52[i - 26];
  }
  return { tenkan, kijun, cloudA, cloudB };
};
E.vwap = (cd) => { // 以 UTC 日為一個交易時段
  const out = new Array(cd.length).fill(NaN); let pv = 0, vv = 0, day = -1, any = false;
  for (let i = 0; i < cd.length; i++) {
    const d = Math.floor(cd[i].t / 86400e3); if (d !== day) { day = d; pv = 0; vv = 0; }
    const v = cd[i].v || 0; if (v > 0) any = true;
    pv += (cd[i].h + cd[i].l + cd[i].c) / 3 * v; vv += v;
    if (vv > 0) out[i] = pv / vv;
  }
  return any ? out : null;
};
E.obv = (c, v) => { const out = [0]; for (let i = 1; i < c.length; i++) out.push(out[i - 1] + (c[i] > c[i - 1] ? v[i] : c[i] < c[i - 1] ? -v[i] : 0)); return out; };

E.indicators = function (cd) {
  const o = cd.map(x => x.o), h = cd.map(x => x.h), l = cd.map(x => x.l), c = cd.map(x => x.c), v = cd.map(x => x.v || 0), n = cd.length;
  const I = { o, h, l, c, v, n };
  I.ema20 = E.ema(c, 20); I.ema50 = E.ema(c, 50);
  I.emaLongN = n >= 240 ? 200 : 100; I.emaLong = E.ema(c, I.emaLongN);
  const m = E.macd(c); I.macd = m.macd; I.macdSig = m.signal; I.macdHist = m.hist;
  I.rsi = E.rsi(c, 14);
  const bb = E.bollinger(c, 20, 2); I.bbMid = bb.mid; I.bbUp = bb.up; I.bbLo = bb.lo; I.pctB = bb.pctB; I.bbWidth = bb.width;
  I.atr = E.atr(h, l, c, 14);
  const ax = E.adx(h, l, c, 14); I.adx = ax.adx; I.pdi = ax.pdi; I.mdi = ax.mdi;
  const st = E.stoch(h, l, c); I.stK = st.k; I.stD = st.d;
  I.cci = E.cci(h, l, c, 20); I.willr = E.willr(h, l, c, 14);
  const sp = E.supertrend(h, l, c, E.atr(h, l, c, 10), 3); I.stLine = sp.line; I.stDir = sp.dir;
  const ps = E.psar(h, l); I.psar = ps.sar; I.psarDir = ps.dir;
  const ic = E.ichimoku(h, l, c); I.tenkan = ic.tenkan; I.kijun = ic.kijun; I.cloudA = ic.cloudA; I.cloudB = ic.cloudB;
  I.dcHi = E.rollMax(h, 20, true); I.dcLo = E.rollMin(l, 20, true);
  I.vwap = E.vwap(cd);
  I.hasVol = v.some(x => x > 0);
  I.obv = I.hasVol ? E.obv(c, v) : null;
  return I;
};

/* ---------- 技術綜合分數（逐根計算，供歷史校準） ---------- */
E.techSeries = function (I) {
  const n = I.n, T = new Array(n).fill(NaN), TR = new Array(n).fill(NaN), MR = new Array(n).fill(NaN), W = new Array(n).fill(NaN);
  for (let i = 60; i < n; i++) {
    const c = I.c[i], atr = I.atr[i]; if (!isNum(atr) || atr <= 0 || !isNum(I.adx[i])) continue;
    const tr = [];
    const eL = isNum(I.emaLong[i]) ? I.emaLong[i] : I.ema50[i];
    tr.push((sign(c - I.ema20[i]) + sign(I.ema20[i] - I.ema50[i]) + sign(I.ema50[i] - eL)) / 3);
    if (isNum(I.macdHist[i])) tr.push(0.5 * sign(I.macdHist[i]) + 0.5 * sign(I.macd[i]));
    tr.push(clip((I.pdi[i] - I.mdi[i]) / 20, -1, 1));
    tr.push(I.stDir[i]);
    if (isNum(I.cloudA[i]) && isNum(I.cloudB[i])) {
      const top = Math.max(I.cloudA[i], I.cloudB[i]), bot = Math.min(I.cloudA[i], I.cloudB[i]);
      tr.push(0.6 * (c > top ? 1 : c < bot ? -1 : 0) + 0.4 * sign(I.tenkan[i] - I.kijun[i]));
    }
    if (I.psarDir[i]) tr.push(I.psarDir[i]);
    if (I.vwap && isNum(I.vwap[i])) tr.push(clip((c - I.vwap[i]) / atr, -1, 1));
    if (isNum(I.dcHi[i]) && I.dcHi[i] > I.dcLo[i]) tr.push(clip(((c - I.dcLo[i]) / (I.dcHi[i] - I.dcLo[i]) - 0.5) * 2, -1, 1));
    if (isNum(I.ema50[i - 5])) tr.push(clip((I.ema50[i] - I.ema50[i - 5]) / (0.75 * atr), -1, 1));
    tr.push(clip((I.rsi[i] - 50) / 20, -1, 1));
    const mr = [];
    if (isNum(I.pctB[i])) mr.push(clip((0.5 - I.pctB[i]) * 2, -1, 1));
    const r = I.rsi[i]; mr.push(r > 70 ? -clip((r - 70) / 15, 0, 1) : r < 30 ? clip((30 - r) / 15, 0, 1) : 0);
    const k = I.stK[i]; if (isNum(k)) mr.push(k > 80 ? -(k - 80) / 20 : k < 20 ? (20 - k) / 20 : 0);
    const cc = I.cci[i]; if (isNum(cc)) mr.push(Math.abs(cc) > 100 ? -sign(cc) * clip((Math.abs(cc) - 100) / 150, 0, 1) : 0);
    const t = mean(tr), m = mean(mr), w = clip((I.adx[i] - 15) / 15, 0, 1);
    TR[i] = t; MR[i] = m; W[i] = w; T[i] = w * t + (1 - w) * (0.35 * t + 0.65 * m);
  }
  return { T, TR, MR, W };
};

/* 以歷史資料校準：相近分數出現後，H 根後收高的比例 */
E.calibrate = function (T, c, H, cur) {
  const pts = [];
  for (let i = 0; i < c.length - H; i++) if (isNum(T[i])) pts.push([T[i], c[i + H] > c[i] ? 1 : 0, i]);
  if (!isNum(cur) || pts.length < 40) return { p: 0.5, n: 0, nEff: 0, raw: NaN, base: NaN };
  let base = 0; for (const p of pts) base += p[1]; base /= pts.length;
  pts.sort((a, b) => Math.abs(a[0] - cur) - Math.abs(b[0] - cur));
  const k = Math.min(pts.length, Math.max(40, Math.round(pts.length * 0.15)));
  const nb = pts.slice(0, k).sort((a, b) => a[2] - b[2]);
  // 相鄰K線的結果高度重疊，先併成「獨立事件」再計算，避免把同一段行情重複計數
  let ups = 0, eff = 0, effUps = 0, gs = 0, gn = 0, prev = -1e9;
  for (const p of nb) {
    ups += p[1];
    if (p[2] - prev >= H) { if (gn) { eff++; effUps += gs / gn; } gs = 0; gn = 0; }
    gs += p[1]; gn++; prev = p[2];
  }
  if (gn) { eff++; effUps += gs / gn; }
  const m = 40; // 向 50% 大幅收縮，避免小樣本過度自信
  return { p: (effUps + 0.5 * m) / (eff + m), n: k, nEff: eff, raw: ups / k, base };
};

/* ---------- 轉折點 ---------- */
E.swings = function (h, l, k, from) {
  const out = [], n = h.length;
  for (let i = Math.max(k, from || 0); i < n - k; i++) {
    let hi = true, lo = true;
    for (let j = i - k; j <= i + k; j++) {
      if (j === i) continue;
      if (h[j] > h[i] || (h[j] === h[i] && j < i)) hi = false;
      if (l[j] < l[i] || (l[j] === l[i] && j < i)) lo = false;
      if (!hi && !lo) break;
    }
    if (hi) out.push({ i, p: h[i], type: 'H' });
    if (lo) out.push({ i, p: l[i], type: 'L' });
  }
  return out;
};
E.zigzag = function (sw, h, l) { // 交替的高低轉折，並補上尚未確認的最新一段
  const z = [];

  const done = d.slice(0, pi + 1), mx = (a, f) => a.reduce((m, x) => Math.max(m, f(x)), -Infinity), mn = (a, f) => a.reduce((m, x) => Math.min(m, f(x)), Infinity);
  const w5 = done.slice(-5), w20 = done.slice(-20);
  return {
    pdh: p.h, pdl: p.l, pdc: p.c, P, R1: 2 * P - p.l, S1: 2 * P - p.h, R2: P + R, S2: P - R, R3: p.h + 2 * (P - p.l), S3: p.l - 2 * (p.h - P),
    todayOpen: today ? today.o : NaN, todayHigh: today ? today.h : NaN, todayLow: today ? today.l : NaN,
    h5: mx(w5, x => x.h), l5: mn(w5, x => x.l), h20: w20.length >= 10 ? mx(w20, x => x.h) : NaN, l20: w20.length >= 10 ? mn(w20, x => x.l) : NaN,
    dayRange: mean(done.slice(-10).map(x => x.h - x.l)),
  };
};

/* ---------- 支撐／阻力聚合 ---------- */
E.levels = function (ctx) {
  const { I, cd, tf, htf, dl, zz, chart, price, atr } = ctx, n = I.n, last = n - 1;
  const cands = [], range = 14 * atr;
  const add = (p, w, tag, grp) => { if (isNum(p) && p > 0 && Math.abs(p - price) <= range) cands.push({ p, w, tag, grp: grp || tag }); };
  // 1) 本週期轉折
  const st = Math.max(0, n - 320);
  for (const s of E.swings(I.h, I.l, 4, st)) add(s.p, 0.9 * (0.5 + 0.5 * (s.i - st) / (n - st)), s.type === 'H' ? '前高' : '前低', 'swing');
  // 2) 較大週期轉折
  (htf || []).forEach((x, k) => {
    if (!x.cd || x.cd.length < 40) return; const hh = x.cd.map(b => b.h), ll = x.cd.map(b => b.l);
    for (const s of E.swings(hh, ll, 3, Math.max(0, hh.length - 160))) add(s.p, k === 0 ? 1.4 : 1.8, E.TF_NAME[x.tf] + (s.type === 'H' ? '前高' : '前低'), 'htf' + k);
  });
  // 3) 日線價位與樞紐點
  if (dl) {
    add(dl.pdh, 2.0, '昨日高點'); add(dl.pdl, 2.0, '昨日低點'); add(dl.pdc, 0.9, '昨日收盤'); add(dl.todayOpen, 0.7, '今日開盤');
    if (Math.abs(dl.todayHigh - price) > 0.5 * atr) add(dl.todayHigh, 1.2, '今日高點');
    if (Math.abs(dl.todayLow - price) > 0.5 * atr) add(dl.todayLow, 1.2, '今日低點');
    add(dl.P, 1.1, '樞紐點 P'); add(dl.R1, 1.0, '樞紐 R1'); add(dl.S1, 1.0, '樞紐 S1'); add(dl.R2, 0.8, '樞紐 R2'); add(dl.S2, 0.8, '樞紐 S2'); add(dl.R3, 0.5, '樞紐 R3'); add(dl.S3, 0.5, '樞紐 S3');
    add(dl.h5, 1.6, '近5日高點'); add(dl.l5, 1.6, '近5日低點'); add(dl.h20, 2.0, '近20日高點'); add(dl.l20, 2.0, '近20日低點');
  }
  // 4) 費波那契回撤（近 120 根高低）
  const w0 = Math.max(0, n - 120); let hi = -Infinity, lo = Infinity, hiI = 0, loI = 0;
  for (let i = w0; i < n - 3; i++) { if (I.h[i] > hi) { hi = I.h[i]; hiI = i; } if (I.l[i] < lo) { lo = I.l[i]; loI = i; } }
  const fib = { hi, lo, up: loI < hiI };
  if (hi - lo > 3 * atr) for (const [r, w] of [[0.382, 0.8], [0.5, 0.8], [0.618, 1.0]]) add(fib.up ? hi - (hi - lo) * r : lo + (hi - lo) * r, w, 'Fib ' + (r * 100).toFixed(1) + '%');
  add(hi, 1.0, '區間高點', 'rangeH'); add(lo, 1.0, '區間低點', 'rangeL');
  // 5) 動態價位
  add(I.ema50[last], 0.6, 'EMA50'); add(I.emaLong[last], 1.0, 'EMA' + I.emaLongN);
  add(I.bbUp[last], 0.5, '布林上軌'); add(I.bbLo[last], 0.5, '布林下軌');
  if (I.vwap) add(I.vwap[last], 0.7, 'VWAP');
  add(I.kijun[last], 0.5, '一目基準線');
  if (isNum(I.cloudA[last]) && isNum(I.cloudB[last])) { add(Math.max(I.cloudA[last], I.cloudB[last]), 0.6, '雲層上緣'); add(Math.min(I.cloudA[last], I.cloudB[last]), 0.6, '雲層下緣'); }
  add(I.stLine[last], 0.7, 'SuperTrend');
  // 6) 整數關卡（三層：大整數、半整數、小整數）
  const k10 = Math.pow(10, Math.floor(Math.log10(60 * atr))), tenth = k10 / 10;
  for (let q = Math.ceil((price - range) / tenth); q * tenth <= price + range; q++) {
    const p = q * tenth, w = q % 10 === 0 ? 1.0 : q % 5 === 0 ? 0.6 : 0.3; add(p, w, '整數關卡', 'round');
  }
  // 7) 密集區
  const vp = E.volProfile(cd);
  if (vp) { const nm = vp.hasVol ? '成交密集' : '停留密集'; add(vp.poc, 1.2, nm + '區 POC'); add(vp.vah, 0.7, nm + '區上緣'); add(vp.val, 0.7, nm + '區下緣'); }
  // 8) 型態線
  for (const ln of (chart.lines || [])) { const b = (ln.p2 - ln.p1) / (ln.i2 - ln.i1); add(ln.p1 + b * (last - ln.i1), 1.0, ln.kind === 'res' ? '壓力趨勢線' : '支撐趨勢線'); }
  for (const c of (chart.list || [])) if (isNum(c.neck)) add(c.neck, 1.2, c.name + '頸線');

  // 聚合
  cands.sort((a, b) => a.p - b.p);
  const tol = 0.35 * atr, zones = []; let cur = null;
  for (const c of cands) {
    if (cur && c.p - cur.lastP <= tol && c.p - cur.minP <= 0.9 * atr) { cur.items.push(c); cur.lastP = c.p; }
    else { cur = { items: [c], minP: c.p, lastP: c.p }; zones.push(cur); }
  }
  const out = zones.map(z => {
    const grpCnt = {}; let W = 0, pw = 0; const tagW = {};
    for (const it of z.items) {
      grpCnt[it.grp] = (grpCnt[it.grp] || 0) + 1; const w = grpCnt[it.grp] > 3 ? 0 : it.w * (grpCnt[it.grp] > 1 ? 0.6 : 1);
      W += w; pw += it.p * it.w; tagW[it.tag] = (tagW[it.tag] || { w: 0, n: 0 }); tagW[it.tag].w += it.w; tagW[it.tag].n++;
    }
    const sw = z.items.reduce((s, it) => s + it.w, 0), p = pw / sw, pad = Math.max(0.08 * atr, (0.2 * atr - (z.lastP - z.minP)) / 2);
    const tags = Object.entries(tagW).sort((a, b) => b[1].w - a[1].w).slice(0, 4).map(([t, v]) => (v.n > 1 ? t + '×' + v.n : t));
    return { p, lo: z.minP - pad, hi: z.lastP + pad, w: W, strength: Math.round(100 * (1 - Math.exp(-W / 4.5))), tags, dist: p - price, distPct: (p - price) / price * 100, distAtr: (p - price) / atr };
  });
  const pickSide = side => {
    const arr = out.filter(z => (side < 0 ? z.p < price : z.p >= price)).sort((a, b) => Math.abs(a.dist) - Math.abs(b.dist)), sel = [];
    for (const z of arr) {
      if (z.strength < 33) continue;
      const pv = sel[sel.length - 1];
      if (pv && Math.abs(z.p - pv.p) < 1.0 * atr) continue;
      sel.push(z); if (sel.length >= 3) break;
    }
    while (sel.length < 3) { // 上方（下方）已無歷史價位時，以 ATR 推估
      const base = sel.length ? sel[sel.length - 1].p : price, p = base + side * 1.6 * atr;
      sel.push({ p, lo: p - 0.1 * atr, hi: p + 0.1 * atr, w: 0, strength: 15, tags: ['ATR 推估'], dist: p - price, distPct: (p - price) / price * 100, distAtr: (p - price) / atr, est: true });
    }
    return sel;
  };
  return { supports: pickSide(-1), resistances: pickSide(1), all: out, fib, vp, pivots: dl };
};

/* ---------- 進場計畫 ---------- */
E.plans = function (ctx) {
  const { I, price, atr, sup, res, pUp, cls, bias } = ctx, n = I.n, { h, l, c } = I, A = I.atr;
  const cost = (ctx.cost != null ? ctx.cost : E.COST[cls]) || 0.0003, H2 = 24, HOLD = 80;
  const exUp = [], exDn = [];
  for (let i = 60; i < n - H2; i++) {
    if (!isNum(A[i])) continue; let mx = -Infinity, mn = Infinity;
    for (let j = i + 1; j <= i + H2; j++) { if (h[j] > mx) mx = h[j]; if (l[j] < mn) mn = l[j]; }
    exUp.push((mx - c[i]) / A[i]); exDn.push((c[i] - mn) / A[i]);
  }
  const pTouch = (dAtr, dir) => { if (dAtr <= 0.03) return 1; const a = dir > 0 ? exUp : exDn; if (!a.length) return NaN; let k = 0; for (const v of a) if (v >= dAtr) k++; return k / a.length; };
  const barrier = (a, b) => { // 歷史上「先到停利或先到停損」的基礎比例（多空兩個方向合併計算，去除歷史趨勢偏差）
    let w = 0, ls = 0;
    for (let i = 60; i < n - 2; i++) {
      if (!isNum(A[i])) continue;
      for (const dir of [1, -1]) {
        const tp = c[i] + dir * a * A[i], sl = c[i] - dir * b * A[i];
        for (let j = i + 1; j < Math.min(n, i + 1 + HOLD); j++) {
          if (dir > 0 ? l[j] <= sl : h[j] >= sl) { ls++; break; }
          if (dir > 0 ? h[j] >= tp : l[j] <= tp) { w++; break; }
        }
      }
    }
    const prior = b / (a + b), m = 30; return { p: (w + prior * m) / (w + ls + m), n: Math.round((w + ls) / 2) };
  };
  const plans = [];
  const build = (side, type, name, entry, sl, tpZones, note) => {
    const d = side === 'long' ? 1 : -1; let risk = d * (entry - sl);
    if (risk < 0.8 * atr) { risk = 0.8 * atr; sl = entry - d * risk; }
    let tp1 = NaN, tp2 = NaN, est = false;
    for (let k = 0; k < tpZones.length; k++) {
      const edge = d > 0 ? tpZones[k].lo : tpZones[k].hi;
      if (d * (edge - entry) >= 0.8 * risk) { tp1 = edge; const nx = tpZones[k + 1]; if (nx) tp2 = d > 0 ? nx.lo : nx.hi; break; }
    }
    if (!isNum(tp1)) { tp1 = entry + d * 1.5 * risk; est = true; }
    if (!isNum(tp2) || d * (tp2 - tp1) < 0.5 * risk) tp2 = tp1 + d * Math.max(risk, 0.6 * d * (tp1 - entry));
    const reward = d * (tp1 - entry), rr = reward / risk;
    const dAtr = Math.abs(entry - price) / atr, tdir = type === 'limit' ? -d : d;
    const pt = type === 'market' ? 1 : pTouch(dAtr, tdir);
    const base = barrier(reward / atr, risk / atr), pDir = d > 0 ? pUp : 1 - pUp;
    // 方向優勢只估到未來 H 根；目標越遠、預期持有越久，優勢打的折扣越多
    const tExp = 2 * (reward / atr) * (risk / atr), fade = clip(Math.sqrt(E.HORIZON / Math.max(tExp, 1)), 0.35, 1);
    const pWin = clip(sigmoid(logit(clip(base.p, 0.03, 0.97)) + 0.8 * fade * logit(pDir)), 0.05, 0.95);
    const costR = cost * entry / risk, ev = pWin * rr - (1 - pWin) - costR;
    let verdict = ev > 0.12 && rr >= 1.2 ? '可考慮' : ev > 0 ? '邊際' : '不建議';
    const kelly = (pWin * (rr + 1) - 1) / rr;
    const against = (bias > 0 && d < 0) || (bias < 0 && d > 0);
    if (against && verdict === '可考慮') verdict = '逆勢・邊際';
    if (risk > 3.5 * atr && verdict === '可考慮') verdict = '邊際';
    // 建議風險：凱利公式的一成，再依評等設上限（模型有誤差，寧可保守）
    const riskPct = ev > 0 ? clip(kelly * 0.1 * 100, 0.2, verdict === '可考慮' ? 2 : 1) : 0;
    plans.push({ side, type, name, entry, sl, tp1, tp2, risk, rr, pTouch: pt, pWin, pBase: base.p, nBase: base.n, ev, costR, riskPct, verdict, against, estTp: est, note, slPct: risk / entry * 100, tpPct: reward / entry * 100, distAtr: dAtr });
  };
  const slBelow = z => { const k = sup.indexOf(z), nx = sup[k + 1]; let s = z.lo - 0.5 * atr; if (nx && !nx.est && z.lo - nx.hi < 0.8 * atr) s = nx.lo - 0.3 * atr; return s; };
  const slAbove = z => { const k = res.indexOf(z), nx = res[k + 1]; let s = z.hi + 0.5 * atr; if (nx && !nx.est && nx.lo - z.hi < 0.8 * atr) s = nx.hi + 0.3 * atr; return s; };
  const S = sup[0], R = res[0];
  const inS = S && !S.est && price - S.hi < 0.12 * atr, inR = R && !R.est && R.lo - price < 0.12 * atr;
  if (S && !S.est) {
    const e = inS ? price : S.hi;
    build('long', inS ? 'market' : 'limit', inS ? '支撐區內做多（現價）' : '回踩支撐做多', e, slBelow(S), res, '等價格回到支撐區、出現止跌K線再進場');
  }
  if (R) {
    const e = R.hi + 0.15 * atr;
    build('long', 'stop', '突破阻力追多', e, Math.max(R.lo - 0.8 * atr, e - 2.2 * atr), res.slice(1), '需收盤站上阻力區才成立，避免假突破');
  }
  if (!inS) build('long', 'market', '現價做多', price, S && !S.est ? slBelow(S) : price - 1.5 * atr, res, '停損放在最近支撐區下方');
  if (R && !R.est) {
    const e = inR ? price : R.lo;
    build('short', inR ? 'market' : 'limit', inR ? '阻力區內做空（現價）' : '反彈阻力做空', e, slAbove(R), sup, '等價格反彈到阻力區、出現轉弱K線再進場');
  }
  if (S) {
    const e = S.lo - 0.15 * atr;
    build('short', 'stop', '跌破支撐追空', e, Math.min(S.hi + 0.8 * atr, e + 2.2 * atr), sup.slice(1), '需收盤跌破支撐區才成立，避免假跌破');
  }
  if (!inR) build('short', 'market', '現價做空', price, R && !R.est ? slAbove(R) : price + 1.5 * atr, sup, '停損放在最近阻力區上方');
  // 首選：期望值 ×（成交機率加權），優先順勢
  let best = null, bs = -Infinity;
  for (const p of plans) {
    if (p.ev < 0.1 || p.rr < 1.1 || p.against) continue;
    const sc = p.ev * (0.4 + 0.6 * p.pTouch); if (sc > bs) { bs = sc; best = p; }
  }
  if (best) best.best = true;
  const ord = p => (p.best ? 0 : 1) * 10 + (p.against ? 5 : 0) + (p.verdict === '可考慮' ? 0 : p.verdict === '邊際' ? 1 : p.verdict === '逆勢・邊際' ? 2 : 3);
  plans.sort((a, b) => ord(a) - ord(b) || b.ev - a.ev);
  return plans;
};

/* ---------- 指標清單（顯示用） ---------- */
E.indicatorList = function (I, dp) {
  const i = I.n - 1, c = I.c[i], f = v => E.fmt(v, dp), f1 = v => (isNum(v) ? v.toFixed(1) : '—'), L = [];
  const eL = I.emaLong[i], al = sign(c - I.ema20[i]) + sign(I.ema20[i] - I.ema50[i]) + (isNum(eL) ? sign(I.ema50[i] - eL) : 0);
  L.push({ name: '均線排列', val: `EMA20 ${f(I.ema20[i])}／50 ${f(I.ema50[i])}`, dir: al >= 2 ? 1 : al <= -2 ? -1 : 0, note: al >= 3 ? '多頭排列' : al <= -3 ? '空頭排列' : al >= 2 ? '偏多' : al <= -2 ? '偏空' : '均線糾結' });
  if (isNum(eL)) L.push({ name: `EMA${I.emaLongN}`, val: f(eL), dir: sign(c - eL), note: c > eL ? '價格在長期均線之上' : '價格在長期均線之下' });
  const mh = I.macdHist[i], mhp = I.macdHist[i - 1];
  L.push({ name: 'MACD', val: `柱 ${mh > 0 ? '+' : ''}${isNum(mh) ? mh.toPrecision(3) : '—'}`, dir: sign(mh), note: (mhp <= 0 && mh > 0) ? '剛黃金交叉' : (mhp >= 0 && mh < 0) ? '剛死亡交叉' : mh > 0 ? (mh > mhp ? '多方動能增強' : '多方動能減弱') : (mh < mhp ? '空方動能增強' : '空方動能減弱') });
  const r = I.rsi[i];
  L.push({ name: 'RSI(14)', val: f1(r), dir: r > 55 ? 1 : r < 45 ? -1 : 0, note: r >= 70 ? '超買，留意回檔' : r <= 30 ? '超賣，留意反彈' : r > 55 ? '多方動能' : r < 45 ? '空方動能' : '中性', warn: r >= 70 || r <= 30 });
  const k = I.stK[i], d = I.stD[i];
  L.push({ name: 'KD(14,3,3)', val: `K ${f1(k)}／D ${f1(d)}`, dir: k > d ? 1 : k < d ? -1 : 0, note: k > 80 ? '高檔鈍化／超買' : k < 20 ? '低檔／超賣' : k > d ? 'K 在 D 之上' : 'K 在 D 之下', warn: k > 80 || k < 20 });
  const pb = I.pctB[i], bw = I.bbWidth.slice(-120).filter(isNum), rank = bw.length ? bw.filter(x => x <= I.bbWidth[i]).length / bw.length : 0.5;
  L.push({ name: '布林通道', val: `%B ${isNum(pb) ? pb.toFixed(2) : '—'}`, dir: pb > 0.8 ? 1 : pb < 0.2 ? -1 : 0, note: (pb > 1 ? '突破上軌' : pb < 0 ? '跌破下軌' : pb > 0.8 ? '貼近上軌' : pb < 0.2 ? '貼近下軌' : '通道中段') + (rank < 0.15 ? '・帶寬收斂（醞釀行情）' : rank > 0.85 ? '・帶寬擴張' : ''), warn: rank < 0.15 });
  const ax = I.adx[i];
  L.push({ name: 'ADX／DMI', val: `ADX ${f1(ax)}`, dir: ax > 20 ? sign(I.pdi[i] - I.mdi[i]) : 0, note: (ax >= 25 ? '趨勢明確' : ax >= 20 ? '趨勢成形中' : '無明顯趨勢') + `（+DI ${f1(I.pdi[i])}／−DI ${f1(I.mdi[i])}）` });
  const cc = I.cci[i];
  L.push({ name: 'CCI(20)', val: isNum(cc) ? cc.toFixed(0) : '—', dir: cc > 100 ? 1 : cc < -100 ? -1 : 0, note: cc > 100 ? '強勢區' : cc < -100 ? '弱勢區' : '常態區' });
  const wr = I.willr[i];
  L.push({ name: '威廉 %R', val: f1(wr), dir: wr > -50 ? 1 : -1, note: wr > -20 ? '超買區' : wr < -80 ? '超賣區' : wr > -50 ? '偏強' : '偏弱', warn: wr > -20 || wr < -80 });
  L.push({ name: 'SuperTrend', val: f(I.stLine[i]), dir: I.stDir[i], note: I.stDir[i] > 0 ? '多方（線在價格下方）' : '空方（線在價格上方）' });
  L.push({ name: '拋物線 SAR', val: f(I.psar[i]), dir: I.psarDir[i], note: I.psarDir[i] > 0 ? '多方' : '空方' });
  if (isNum(I.cloudA[i]) && isNum(I.cloudB[i])) {
    const top = Math.max(I.cloudA[i], I.cloudB[i]), bot = Math.min(I.cloudA[i], I.cloudB[i]);
    L.push({ name: '一目均衡表', val: `雲 ${f(bot)}–${f(top)}`, dir: c > top ? 1 : c < bot ? -1 : 0, note: (c > top ? '價格在雲層之上' : c < bot ? '價格在雲層之下' : '價格在雲層內') + (I.tenkan[i] > I.kijun[i] ? '・轉換線>基準線' : '・轉換線<基準線') });
  }
  if (I.vwap && isNum(I.vwap[i])) L.push({ name: 'VWAP', val: f(I.vwap[i]), dir: sign(c - I.vwap[i]), note: c > I.vwap[i] ? '價格在當日均價之上' : '價格在當日均價之下' });
  if (isNum(I.dcHi[i])) L.push({ name: '20 根高低通道', val: `${f(I.dcLo[i])}–${f(I.dcHi[i])}`, dir: c > I.dcHi[i] ? 1 : c < I.dcLo[i] ? -1 : 0, note: c > I.dcHi[i] ? '創 20 根新高' : c < I.dcLo[i] ? '創 20 根新低' : '區間內' });
  if (I.obv && i >= 20) {
    const dv = sign(I.obv[i] - I.obv[i - 20]), dpx = sign(c - I.c[i - 20]);

function quoteRate(cur) { // 1 單位該貨幣值多少美元
  if (cur === 'USD' || cur === 'USDT') return 1;
  if (cur === 'HKD') return 1 / 7.8; // 港幣釘住美元
  const a = Data.byId(cur + 'USD'), b = Data.byId('USD' + cur), last = i => { for (const tf of ['1h', '15m', '5m', '1m', '4h', '30m', '1d']) { const c = Data.peek(i, tf); if (c && c.cd && c.cd.length) return c.cd[c.cd.length - 1].c; } return null; };
  if (a) { const v = last(a); if (v) return v; } if (b) { const v = last(b); if (v) return 1 / v; } return null;
}
function renderCalc() {
  const out = $('#calc-out'), p = selPlan(); if (!out) return; if (!p) { out.textContent = ''; return; }
  const inst = det.inst, parts = (inst.code || '').split('/'), base = parts[0] || inst.id, quote = inst.quote || parts[1] || 'USD', qr = quoteRate(quote), money = S.equity * S.riskPct / 100;
  if (!qr || !(S.equity > 0) || !(S.riskPct > 0)) { out.textContent = qr ? '請輸入本金與風險比例。' : `需要 ${quote} 兌美元的報價才能試算（先到掃描頁載入一次外匯）。`; return; }
  const units = money / (p.risk * qr), notional = units * p.entry * qr, margin = notional / Math.max(1, S.lev);
  const lot = inst.cls === 'fx' ? units / 1e5 : inst.id === 'XAUUSD' ? units / 100 : inst.id === 'XAGUSD' ? units / 5000 : null, us = v => '$' + v.toLocaleString('en-US', { maximumFractionDigits: v < 100 ? 2 : 0 });
  const unit = inst.cls === 'stock' || inst.cls === 'etf' ? '股' : inst.cls === 'index' ? '單位（每點 1 ' + quote + '）' : esc(base);
  out.innerHTML = `「${esc(p.name)}」：最多虧 <b>${us(money)}</b>　部位 <b>${units.toLocaleString('en-US', { maximumFractionDigits: units < 10 ? 4 : 0 })}</b> ${unit}${lot != null ? `（約 <b>${lot.toFixed(2)}</b> 標準手）` : ''}　名目價值 <b>${us(notional)}</b>　保證金約 <b>${us(margin)}</b>${margin > S.equity ? '　<b>保證金超過本金，請降低風險或提高槓桿。</b>' : ''}${p.riskPct > 0 && S.riskPct > p.riskPct + 0.05 ? `<br>提醒：這個方案建議的風險上限是 ${p.riskPct.toFixed(1)}%，你設定的比較高。` : ''}<br><small>各券商的合約規格不同，手數請以你的平台為準。</small>`;
}

    <section class="card"><h2>怎麼讀這一頁</h2><ul class="plain">
      <li>「上漲機率」是未來 ${E.HORIZON} 根 K 線收得比現在高的估計機率。短線行情接近隨機，多數時候會落在 45–55%，那代表「沒有優勢、不必硬做」。</li>
      <li>評級 A 到 D 是把機率優勢、進場計畫的期望值、多週期方向、策略訊號與趨勢強度合起來打分數。在純隨機的行情裡，大約只有 3–4% 會拿到 A，所以 A 不常見是正常的。</li>
      <li>「精選 10」是當下分數最高的 10 項，不保證每一項都值得進場——請看評級，C 和 D 就是還不到標準。</li>
      <li>支撐、阻力來自：前高前低、較大週期的轉折、昨日高低收、樞紐點、費波那契、均線、布林、VWAP、一目均衡表、整數關卡、成交密集區與趨勢線，價位接近的會合併成一個區間。</li>
      <li>進場計畫的勝率與期望值已扣點差。1 分、5 分 K 的雜訊最多、點差占比最高；想提高勝率，先看 1 小時與 4 小時的方向，再用小週期找進場點。</li>
      <li>價格和你的券商不會完全一樣，每張卡片下方都寫了報價來源與時間。股票、原油、黃金多半來自交易所的 24 小時合約，會和現貨差一點點，美股休市時差距較大；指數用的是期貨價，和現貨指數通常差幾十點；標示「延遲」的來源慢 10–15 分鐘。「今日」漲跌是從臺北時間 08:00（國際換日）起算，和券商的算法可能不同。</li>
      <li>本頁是分析輔助，不是投資建議。差價合約有槓桿，請務必設停損並控制每筆風險。</li></ul></section>`;
}
async function runDiag() {
  if (diag.running) return; diag.running = true; diag.rows = []; renderSettings(); const list = Data.all(); let i = 0;
  const w = async () => { while (i < list.length) { const inst = list[i++], row = { name: inst.name, ok: false, msg: '' }; diag.rows.push(row); try { const r = await Data.fetchFull(inst, '15m', 60); row.ok = true; row.msg = r.src.label; } catch (e) { row.msg = e.message; } if (view === 'settings') renderSettings(); } };
  await Promise.all([w(), w(), w()]); diag.running = false; if (view === 'settings') renderSettings();
}

/* ---------- 切換與事件 ---------- */
const VIEWS = ['scan', 'detail', 'track', 'news', 'settings'];
function show(v) {
  view = v; for (const k of VIEWS) $('#v-' + k).hidden = k !== v;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* 忽略 */ }
  if (v === 'scan') { clsChips(); renderScan(); if (!scan.running && (Date.now() - scan.last > 30e3 || scan.tf !== S.scanTf)) runScan(); }
  if (v === 'detail') { $('#d-inst').value = S.inst; tfChips('#d-tf', S.tf); const k = S.inst + '|' + S.tf; if (det.key !== k) loadDetail(true); else loadDetail(false); }
  if (v === 'track') { renderTrack(); monitor(); }
  if (v === 'news') { renderNews(); refreshNews(false); Inter.refresh().then(() => view === 'news' && renderNews()).catch(() => {}); }
  if (v === 'settings') renderSettings();
  window.scrollTo(0, 0);
}
function fillSelect() {
  const groups = {}; for (const i of Data.all()) (groups[i.cls] = groups[i.cls] || []).push(i);
  $('#d-inst').innerHTML = CLS.filter(c => groups[c]).map(c => `<optgroup label="${Data.CLS_NAME[c] || c}">${groups[c].map(i => `<option value="${esc(i.id)}">${esc(i.name)}　${esc(i.code)}</option>`).join('')}</optgroup>`).join('');
  $('#d-inst').value = S.inst;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-view]'); if (!t) return; const d = t.dataset;
  if (d.view) return show(d.view);
  if (t.id === 'btn-refresh') { if (view === 'scan') { scan.last = 0; Data.resetHosts(); Data.clear(); runScan(); } else if (view === 'detail') loadDetail(false); else if (view === 'news') { refreshNews(true); Inter.updated = 0; renderNews(); } else if (view === 'track') { TR.last = 0; monitor(); } return; }
  if (t.id === 'demo-on' || t.id === 'demo-on2') return setDemo(true);
  if (t.id === 'demo-off') return setDemo(false);
  if (t.id === 'demo-toggle') return setDemo(!Data.demo);
  if (t.id === 'retry') { offline = false; banner(); Data.resetHosts(); Data.clear(); scan.last = 0; return show(view); }
  if (t.id === 'd-retry') return loadDetail(true);
  if (t.id === 'diag-run') return runDiag();
  if (t.id === 'beep-test') { unlockAudio(); return beep('tp1'); }
  if (t.id === 'notif-on') { try { Notification.requestPermission().then(() => view === 'track' && renderTrack()); } catch (x) { /* 忽略 */ } return; }
  if (t.id === 'alerts-clear') { TR.alerts = []; saveTR(); badge(); return renderTrack(); }
  if (t.id === 'hist-clear') { TR.list = TR.list.filter(Track.active); saveTR(); return renderTrack(); }
  if (t.id === 'cu-add') {
    const name = $('#cu-name').value.trim(), sym = $('#cu-sym').value.trim(), src = $('#cu-src').value, cls = $('#cu-cls').value, dp = clip(parseInt($('#cu-dp').value, 10) || 0, 0, 8);
    if (!name || !sym) return; const id = 'C_' + src + '_' + sym.replace(/[^A-Za-z0-9]/g, '');
    if (!Data.byId(id)) { Data.custom.push({ id, name, code: sym, cls, dp, src: [[src, sym]], expo: cls === 'crypto' ? { CRYPTO: 1, USD: -0.3, RISK: 0.4 } : cls === 'fx' ? { USD: -1 } : cls === 'metal' || cls === 'cmdty' ? { USD: -0.4, RISK: 0.3 } : { RISK: 1 }, demo: [100, 0.0006], custom: true }); LS.set('cfd.custom', Data.custom); fillSelect(); scan.last = 0; }
    return renderSettings();
  }
  if (d.del) { Data.custom = Data.custom.filter(c => c.id !== d.del); LS.set('cfd.custom', Data.custom); delete scan.rows[d.del]; if (S.inst === d.del) { S.inst = DEF.inst; save(); } fillSelect(); return renderSettings(); }
  if (d.on) { S.on[d.on] = S.on[d.on] === false; if (!CLS.some(c => S.on[c] !== false)) S.on[d.on] = true; save(); for (const k in scan.rows) if (S.on[scan.rows[k].inst.cls] === false) delete scan.rows[k]; scan.last = 0; return renderSettings(); }
  if (d.set) { const v = d.v === 'true' ? true : d.v === 'false' ? false : d.v; S[d.set] = v; save(); applyTheme(); return view === 'track' ? renderTrack() : renderSettings(); }
  if (d.tf) {
    if (t.parentElement.id === 'scan-tf') { S.scanTf = d.tf; save(); tfChips('#scan-tf', S.scanTf); scan.token++; scan.rows = {}; scan.tf = d.tf; if (!scan.running) runScan(); else renderScan(); }
    else { S.tf = d.tf; save(); tfChips('#d-tf', S.tf); loadDetail(true); }
    return;
  }
  if (d.cls) { S.cls = d.cls; save(); clsChips(); return renderScan(); }
  if (d.ttrack) { const r = scan.rows[d.ttrack]; if (r && r.plan) { addTrack(r.inst, r.plan, r.tf); renderScan(); } return; }
  if (d.track != null) { const p = det.A && det.A.plans[+d.track]; if (p) { addTrack(det.inst, p, det.tf); renderDetail(); } return; }
  if (d.posClose) { const p = TR.list.find(x => x.id === d.posClose); if (p && Track.active(p)) { Track.close(p, isNum(p.price) ? p.price : p.entry, 'manual', Date.now()); saveTR(); badge(); renderTrack(); } return; }
  if (d.posDel) { TR.list = TR.list.filter(x => x.id !== d.posDel); saveTR(); badge(); return renderTrack(); }
  if (d.id && (t.classList.contains('row') || t.classList.contains('t-open') || d.go)) { if (!Data.byId(d.id)) return; S.inst = d.id; const pz = d.go && TR.list.find(x => x.instId === d.id && Track.active(x)); S.tf = pz ? pz.tf : (d.go ? S.tf : S.scanTf); save(); return show('detail'); }
  if (d.show != null) { const p = det.A.plans[+d.show]; if (p) { det.sel = planKey(p); renderDetail(); const c = $('#s-chart'); if (c && window.innerWidth < 1020) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (d.z) { const c = det.chart; if (c) { if (d.z === 'in') c.zoom(0.75); else if (d.z === 'out') c.zoom(1.33); else c.reset(); } return; }
  if (d.feed) { newsFeed = d.feed; return renderNews(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'd-inst') { S.inst = t.value; save(); loadDetail(true); }
  if (t.dataset && t.dataset.cost) { const v = parseFloat(t.value); if (v >= 0) { S.cost[t.dataset.cost] = v; save(); } }
});
document.addEventListener('input', e => {
  const t = e.target, m = { 'c-eq': 'equity', 'c-risk': 'riskPct', 'c-lev': 'lev' }[t.id];
  if (m) { const v = parseFloat(t.value); S[m] = isNum(v) ? v : 0; save(); renderCalc(); }
});
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) openSt[k] = e.target.open; }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { TR.last = 0; monitor(); quick.last = 0; } });
window.addEventListener('resize', () => { if (det.chart && view === 'detail') det.chart.draw(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => det.chart && det.chart.draw());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => det.chart && det.chart.draw());

function tick() {
  $('#clock').textContent = hms(Date.now()); const now = Date.now();
  if (now - TR.last > 15e3) monitor(); // 追蹤單不受「自動更新」與背景影響
  if (document.hidden || !S.auto || Data.demo) return;
  if (view === 'detail' && det.inst && !det.loading && now - det.last > (E.TF[S.tf] <= 300e3 ? 8e3 : 15e3)) loadDetail(false);
  if (view === 'scan' && !scan.running && scan.last && now - scan.last > 60e3) runScan();
  if (view === 'scan' && scan.last && now - quick.last > 10e3) quickPrices();
  if (view === 'track' && !scan.running && now - scan.last > 5 * 60e3 && TR.list.some(Track.active)) runScan(); // 讓追蹤單的評級保持更新
  if (!News.loading && now - News.updated > 12 * 60e3) refreshNews(false);
}
function boot() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'demo') Data.demo = true;
  applyTheme(); fillSelect(); tfChips('#scan-tf', S.scanTf); tfChips('#d-tf', S.tf); clsChips(); badge();
  banner(); show(VIEWS.includes(h) ? h : 'scan');
  refreshNews(true); setInterval(tick, 1000); tick();
}
window.__app = { S, det, scan, show, setDemo, TR, addTrack, monitor };
boot();
})();
